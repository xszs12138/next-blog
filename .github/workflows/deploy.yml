name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter web prisma:generate
        env:
          DATABASE_URL: file:./data.db

      - name: Build
        run: pnpm --filter web build
        env:
          DATABASE_URL: file:./data.db

      - name: Package standalone output
        run: |
          cd apps/web
          tar czf ../../deploy-package.tar.gz \
            .next/standalone \
            .next/static \
            public \
            prisma

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and deploy
        run: |
          scp -P "$SSH_PORT" deploy-package.tar.gz "$SSH_USER@$SSH_HOST:~/"

          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" << 'REMOTE'
            set -e
            mkdir -p "$DEPLOY_PATH"
            mv ~/deploy-package.tar.gz "$DEPLOY_PATH/"
            cd "$DEPLOY_PATH"

            # Stop the app
            pm2 stop next-blog 2>/dev/null || true

            # Backup database
            if [ -f standalone/data.db ]; then
              cp standalone/data.db data.db.bak
            fi

            # Remove old build, extract new one
            rm -rf standalone
            tar xzf deploy-package.tar.gz
            mv .next/standalone standalone
            mv .next/static standalone/apps/web/.next/static
            cp -r public standalone/apps/web/public 2>/dev/null || true
            cp -r prisma standalone/prisma
            rm -rf .next public prisma deploy-package.tar.gz

            # Restore database
            if [ -f data.db.bak ] && [ ! -f standalone/data.db ]; then
              mv data.db.bak standalone/data.db
              rm -f data.db.bak
            fi

            # Run migrations
            cd standalone
            cp "$DEPLOY_PATH/.env" .env
            prisma migrate deploy

            # Start the app
            pm2 start apps/web/server.js --name next-blog --cwd "$PWD" || pm2 reload next-blog
            pm2 save
          REMOTE

      - name: Health check
        run: |
          sleep 3
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "curl -sf http://127.0.0.1:3000/api/health && echo 'OK' || echo 'FAIL'"
